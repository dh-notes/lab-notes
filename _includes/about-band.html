<div class="relative flex flex-col border-b border-ink px-4 py-10">
  <p class="@container mt-2 mb-[1.2rem] max-w-full font-wordmark text-band {{ include.weight | default: "font-extrabold" }} leading-[1.05] tracking-[-0.02em] text-ink stack:max-w-col-8">
    {{ include.content }}
  </p>
  {%- if include.label %}
  <span class="absolute bottom-2 left-4 hidden font-fragment text-[0.7rem] tracking-[0.04em] text-grey stack:block">{{ include.label }}</span>
  {%- endif %}
</div>
