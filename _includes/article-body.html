{% if page.abstract or page.summary %}
<div class="border-b border-ink bg-stone text-ink">
  <div class="px-4 pt-8 pb-10">
    <span class="mb-4 block font-fragment text-[0.7rem] uppercase tracking-[0.18em] text-grey">Abstract</span>
    <div class="font-fragment text-[0.88rem] leading-[1.9] text-grey [&_em]:italic [&_em]:text-ink">
      <p>{% if page.abstract %}{{ page.abstract }}{% else %}{{ page.summary }}{% endif %}</p>
    </div>
  </div>
</div>
{% endif %}

<div class="prose-article px-4 py-6 stack:py-12">
  {{ content }}
</div>
